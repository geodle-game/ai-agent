name: Run Nanbeige Model
on:
  workflow_dispatch:   # lets you trigger it manually
  push:
    branches: [main]

jobs:
  run-model:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reassemble GGUF chunks from manifest
        run: python3 scripts/assemble_model.py

      - name: Download prebuilt llama.cpp binaries
        run: |
          curl -L -o llama.zip \
            https://github.com/ggml-org/llama.cpp/releases/latest/download/llama-b6000-bin-ubuntu-x64.zip
          unzip -q llama.zip -d llama
          # The binary is typically in llama/build/bin/
          ls -lh llama/build/bin/

      - name: Run inference with llama-cli
        run: |
          ./llama/build/bin/llama-cli \
            -m models/nanbeige-reassembled.gguf \
            -p "Explain what this repository does in one sentence." \
            -n 128 \
            --threads 4 \
            --no-display-prompt
