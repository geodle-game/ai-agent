name: Run Nanbeige Model

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  run-model:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Reassemble GGUF chunks from manifest
        run: |
          python3 scripts/assemble_model.py
          ls -lh models/

      - name: Download prebuilt llama.cpp binaries (CPU, Ubuntu x64)
        run: |
          if ! command -v jq &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y jq
          fi

          echo "Searching for a release that contains the Ubuntu x64 CPU tarball..."
          # Get the last 30 releases, find the first one with the right asset
          ASSET_URL=$(curl -s "https://api.github.com/repos/ggml-org/llama.cpp/releases?per_page=30" \
            | jq -r '
                .[] 
                | select(.assets | any(.name | test("bin-ubuntu-x64\\.tar\\.gz$"))) 
                | .assets[] 
                | select(.name | test("bin-ubuntu-x64\\.tar\\.gz$")) 
                | .browser_download_url
              ' | head -n 1)

          if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
            echo "ERROR: Could not find any release containing bin-ubuntu-x64.tar.gz."
            echo "Listing assets from the most recent 5 releases for debugging:"
            curl -s "https://api.github.com/repos/ggml-org/llama.cpp/releases?per_page=5" \
              | jq -r '.[] | "\(.tag_name): \(.assets[].name // "no assets")"'
            exit 1
          fi

          echo "Found asset: $ASSET_URL"
          curl -L -o llama.tar.gz "$ASSET_URL"

          mkdir -p llama
          tar -xzf llama.tar.gz -C llama

          echo "--- Binaries found: ---"
          find llama -type f -name "llama-*" -executable | head -20

            - name: Run inference with llama-cli
        run: |
          LLAMA_CLI=$(find llama -type f -name "llama-cli" | head -n 1)
          chmod +x "$LLAMA_CLI"

          "$LLAMA_CLI" \
            -m models/nanbeige-reassembled.gguf \
            -p "$PROMPT" \
            -n -1 \
            -c 8192 \
            --threads 4 \
            --temp 0.7 \
            --no-display-prompt \
            --no-warmup \
            -no-cnv \
            2>&1 | tee model_output.txt

          echo "=== MODEL OUTPUT ==="
          cat model_output.txt
