name: Talk to AI

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Your message to the AI"
        required: false
        type: string
      mode:
        description: "chat = Nanbeige brain, tool = Needle hands"
        required: false
        default: "chat"
        type: choice
        options:
          - chat
          - tool
  push:
    branches: [main]
    paths-ignore:
      - 'output/**'

permissions:
  contents: read

jobs:
  talk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve prompt
        id: resolve
        run: |
          PROMPT="${{ github.event.inputs.prompt }}"
          if [ -z "$PROMPT" ] && [ -f prompt.txt ]; then
            PROMPT=$(cat prompt.txt)
          fi
          if [ -z "$PROMPT" ]; then
            PROMPT="Say hello and explain what this repository does."
          fi
          {
            echo "PROMPT<<EOF"
            echo "$PROMPT"
            echo "EOF"
          } >> "$GITHUB_ENV"
          echo "Resolved prompt: $PROMPT"

      # ============================================================
      # CHAT MODE — Nanbeige brain
      # ============================================================
      - name: Reassemble Nanbeige GGUF chunks
        if: github.event.inputs.mode != 'tool'
        run: |
          python3 scripts/assemble_model.py
          ls -lh models/

      - name: Download llama.cpp binaries (CPU, Ubuntu x64)
        if: github.event.inputs.mode != 'tool'
        run: |
          if ! command -v jq &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y jq
          fi
          ASSET_URL=$(curl -s "https://api.github.com/repos/ggml-org/llama.cpp/releases?per_page=30" \
            | jq -r '
                .[]
                | select(.assets | any(.name | test("bin-ubuntu-x64\\.tar\\.gz$")))
                | .assets[]
                | select(.name | test("bin-ubuntu-x64\\.tar\\.gz$"))
                | .browser_download_url
              ' | head -n 1)
          if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
            echo "ERROR: Could not find any release with bin-ubuntu-x64.tar.gz"
            exit 1
          fi
          echo "Downloading: $ASSET_URL"
          curl -L -o llama.tar.gz "$ASSET_URL"
          mkdir -p llama && tar -xzf llama.tar.gz -C llama
          find llama -type f -name "llama-cli" -executable

      - name: Run inference with llama-cli
        if: github.event.inputs.mode != 'tool'
        run: |
          LLAMA_CLI=$(find llama -type f -name "llama-cli" | head -n 1)
          if [ -z "$LLAMA_CLI" ]; then
            echo "ERROR: llama-cli not found"
            exit 1
          fi
          chmod +x "$LLAMA_CLI"
          mkdir -p output

          # Conversation mode (chat template applied) + /exit via stdin.
          # No -no-cnv anywhere: it disables the chat template and recent
          # llama.cpp builds don't accept the single-dash form.
          printf '/exit\n' | "$LLAMA_CLI" \
            -m models/nanbeige-reassembled.gguf \
            -p "$PROMPT" \
            -n -1 \
            -c 8192 \
            --threads 4 \
            --temp 0.7 \
            --no-display-prompt \
            --no-warmup \
            > output/model_output.txt 2> output/llama_stderr.log

          echo "=== STDOUT size: $(stat -c%s output/model_output.txt) bytes ==="
          echo "=== STDERR size: $(stat -c%s output/llama_stderr.log) bytes ==="
          echo ""
          echo "=== STDOUT preview ==="
          head -c 2000 output/model_output.txt || true
          echo ""
          echo "=== STDERR tail ==="
          tail -c 1000 output/llama_stderr.log || true
          echo ""

          # Fallback: some builds write generated tokens to stderr.
          if [ ! -s output/model_output.txt ] || [ "$(stat -c%s output/model_output.txt)" -lt 10 ]; then
            echo "WARN: stdout empty — copying stderr as fallback"
            cp output/llama_stderr.log output/model_output.txt
          fi

          # Strip REPL noise: ANSI codes, timing line, bare ">" prompt, "Exiting..."
          sed -E \
            -e 's/\x1b\[[0-9;]*[a-zA-Z]//g' \
            -e '/^\[ Prompt: .*t\/s.*\]$/d' \
            -e '/^Exiting\.\.\.$/d' \
            -e '/^> *$/d' \
            output/model_output.txt > output/clean_output.txt || cp output/model_output.txt output/clean_output.txt

          # Hard fail if we still have nothing — don't silently produce empty reports.
          CLEAN_SIZE=$(stat -c%s output/clean_output.txt)
          echo "=== CLEAN size: ${CLEAN_SIZE} bytes ==="
          if [ "$CLEAN_SIZE" -lt 5 ]; then
            echo "ERROR: Model produced no usable output. See llama_stderr.log above."
            exit 1
          fi

          echo "=== CLEAN OUTPUT ==="
          cat output/clean_output.txt

      - name: Write response markdown
        if: github.event.inputs.mode != 'tool'
        run: |
          {
            echo "# Prompt"
            echo ""
            echo "$PROMPT"
            echo ""
            echo "---"
            echo ""
            echo "# Response"
            echo ""
            echo '```'
            cat output/clean_output.txt
            echo '```'
            echo ""
            echo "---"
            echo ""
            echo "_Generated by Nanbeige 3B (Q2_K) in GitHub Actions on $(date -u +'%Y-%m-%d %H:%M UTC')_"
          } > output/response.md

      - name: Publish to step summary (chat)
        if: github.event.inputs.mode != 'tool'
        run: cat output/response.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload chat artifacts
        if: always() && github.event.inputs.mode != 'tool'
        uses: actions/upload-artifact@v4
        with:
          name: chat-output
          path: |
            output/response.md
            output/model_output.txt
            output/clean_output.txt
            output/llama_stderr.log
          if-no-files-found: warn
          retention-days: 7

      # ============================================================
      # TOOL MODE — Needle hands
      # ============================================================
      - name: Install Needle
        if: github.event.inputs.mode == 'tool'
        run: |
          python -m pip install --upgrade pip
          pip install cactus-needle requests

      - name: Run tool mode (Needle agent)
        if: github.event.inputs.mode == 'tool'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGENT_QUERY: ${{ env.PROMPT }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p output
          python run_agent.py
          if [ -f output/agent_result.json ]; then
            {
              echo "# Tool Mode Result"
              echo ""
              echo "**Query:** $AGENT_QUERY"
              echo ""
              echo '```json'
              cat output/agent_result.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload tool artifacts
        if: always() && github.event.inputs.mode == 'tool'
        uses: actions/upload-artifact@v4
        with:
          name: tool-output
          path: output/agent_result.json
          if-no-files-found: warn
          retention-days: 7
