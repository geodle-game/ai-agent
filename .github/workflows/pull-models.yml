name: Pull & Split Models

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pull-and-split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install HF CLI
        run: pip install -q huggingface_hub

      - name: Download Nanbeige Q2_K (any filename)
        run: |
          hf download tinyopsec/Nanbeige4.2-3B-GGUF \
            --include "*Q2_K*" \
            --local-dir ./downloaded
          echo "Downloaded Nanbeige files:"
          find ./downloaded -name '*.gguf' -ls

      - name: Download Needle 2 (any .cact)
        run: |
          hf download Cactus-Compute/needle2 \
            --include "*.cact" \
            --local-dir ./downloaded
          echo "Downloaded Needle files:"
          find ./downloaded -name '*.cact' -ls

      - name: Resolve downloaded filenames
        run: |
          GGUF=$(find ./downloaded -name '*.gguf' | head -n1)
          CACT=$(find ./downloaded -name '*.cact' | head -n1)
          if [ -z "$GGUF" ]; then echo "No GGUF found"; exit 1; fi
          if [ -z "$CACT" ]; then echo "No .cact found"; exit 1; fi
          echo "GGUF=$GGUF" >> $GITHUB_ENV
          echo "CACT=$CACT" >> $GITHUB_ENV

      - name: Get llama-gguf-split
        run: |
          wget -q https://github.com/ggml-org/llama.cpp/releases/download/b7075/llama-b7075-bin-ubuntu-x64.zip
          unzip -q llama-b7075-bin-ubuntu-x64.zip -d llama-bin
          SPLITTER=$(find llama-bin -name 'llama-gguf-split' -type f | head -n1)
          chmod +x "$SPLITTER"
          echo "SPLITTER=$SPLITTER" >> $GITHUB_ENV

      - name: Split into 75 MB chunks
        run: |
          mkdir -p models
          $SPLITTER --split --split-max-size 75M \
            "$GGUF" \
            ./models/nanbeige-chunk
          cd models
          i=0
          for f in nanbeige-chunk-*.gguf; do
            mv "$f" "nanbeige-part-$(printf '%03d' $i).gguf"
            i=$((i+1))
          done
          ls -lh

      - name: Copy Needle
        run: cp "$CACT" ./models/needle2.cact

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models/
          git commit -m "Add split Nanbeige chunks + Needle 2"
          git push
