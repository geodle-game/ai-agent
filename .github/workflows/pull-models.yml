name: Pull & Split Models

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  HF_REPO: tinyopsec/Nanbeige4.2-3B-GGUF
  IMAT_REPO: mradermacher/Nanbeige4.2-3B-Base-i1-GGUF
  BASE_QUANT: Q2_K
  EMBED_TYPE: IQ1_S
  OUTPUT_TYPE: IQ1_S
  SPLIT_SIZE: 200M

jobs:
  pull-and-split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Install Hugging Face CLI
        run: pip install -q huggingface_hub

      - name: Download Nanbeige base GGUF
        run: |
          hf download "$HF_REPO" \
            --include "*${BASE_QUANT}*" \
            --local-dir ./downloaded
          echo "Downloaded:"
          find ./downloaded -name '*.gguf' -ls

      - name: Download Nanbeige imatrix
        run: |
          hf download "$IMAT_REPO" \
            --include "*imatrix*" \
            --local-dir ./imatrix
          echo "Downloaded imatrix:"
          find ./imatrix -type f -ls

      - name: Download Needle 2
        run: |
          hf download Cactus-Compute/needle2 \
            --include "*.cact" \
            --local-dir ./downloaded
          echo "Downloaded Needle:"
          find ./downloaded -name '*.cact' -ls

      - name: Resolve downloaded files
        run: |
          SRC=$(find ./downloaded -name '*Q2_K*.gguf' | head -n1)
          if [ -z "$SRC" ]; then SRC=$(find ./downloaded -name '*.gguf' | head -n1); fi
          CACT=$(find ./downloaded -name '*.cact' | head -n1)
          IMAT=$(find ./imatrix -type f \( -name '*imatrix*' -o -name '*.dat' \) | head -n1)
          if [ -z "$SRC" ]; then echo "No GGUF found"; exit 1; fi
          if [ -z "$CACT" ]; then echo "No .cact found"; exit 1; fi
          if [ -z "$IMAT" ]; then echo "No imatrix found"; exit 1; fi
          echo "SRC=$SRC" >> $GITHUB_ENV
          echo "CACT=$CACT" >> $GITHUB_ENV
          echo "IMAT=$IMAT" >> $GITHUB_ENV
          echo "Using source: $SRC"
          echo "Using needle: $CACT"
          echo "Using imatrix: $IMAT"

      - name: Build llama.cpp from master (Nanbeige support)
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git
          cd llama.cpp
          cmake -B build -DGGML_NATIVE=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j 4
          echo "QUANT=$PWD/build/bin/llama-quantize" >> $GITHUB_ENV
          echo "SPLITTER=$PWD/build/bin/llama-gguf-split" >> $GITHUB_ENV

      - name: Re-quantize with IQ1_S embedding (using imatrix)
        run: |
          mkdir -p models
          $QUANT \
            --allow-requantize \
            --imatrix "$IMAT" \
            --token-embedding-type "$EMBED_TYPE" \
            --output-tensor-type "$OUTPUT_TYPE" \
            "$SRC" ./models/nanbeige-optimized.gguf "$BASE_QUANT"
          ls -lh ./models/nanbeige-optimized.gguf

      - name: Split into chunks
        run: |
          cd models
          $SPLITTER --split --split-max-size "$SPLIT_SIZE" \
            nanbeige-optimized.gguf \
            nanbeige-chunk
          i=0
          for f in nanbeige-chunk-*.gguf; do
            mv "$f" "nanbeige-part-$(printf '%03d' $i).gguf"
            i=$((i+1))
          done
          rm -f nanbeige-optimized.gguf
          echo "Chunk sizes:"
          ls -lh

      - name: Verify max chunk under 100 MiB
        run: |
          MAX=$(find ./models -name 'nanbeige-part-*.gguf' -printf '%s\n' | sort -n | tail -n1)
          MAX_MIB=$(echo "scale=2; $MAX / 1048576" | bc)
          echo "Largest chunk: ${MAX_MIB} MiB"
          if (( $(echo "$MAX_MIB > 100" | bc -l) )); then
            echo "ERROR: largest chunk exceeds 100 MiB. Embedding tensor too large."
            echo "You must switch to vocab trimming (Option B) to solve this."
            exit 1
          fi
          echo "All chunks under 100 MiB. Safe to commit."

      - name: Copy Needle
        run: cp "$CACT" ./models/needle2.cact

      - name: Commit chunks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models/
          git commit -m "Add optimized Nanbeige chunks (embedding=${EMBED_TYPE}, split=${SPLIT_SIZE})"
          git push
