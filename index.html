<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nanbeige Agent — Loader</title>
  <style>
    body { font-family: -apple-system, sans-serif; padding: 16px; max-width: 720px; margin: 0 auto; }
    button, input { font-size: 16px; padding: 10px; margin: 6px 0; width: 100%; box-sizing: border-box; }
    #log { background:#111; color:#0f0; font-family:monospace; font-size:12px; padding:12px;
           height:320px; overflow-y:auto; white-space:pre-wrap; border-radius:8px; }
    #bar { height:10px; background:#333; border-radius:5px; overflow:hidden; margin:8px 0; }
    #fill { height:100%; width:0%; background:#0f0; transition:width .2s; }
    .ok{color:#0f0} .err{color:#f55} .warn{color:#ff0}
  </style>
</head>
<body>
  <h2>Nanbeige Loader</h2>
  <label>Manifest URL</label>
  <input id="manifestUrl"
    value="https://raw.githubusercontent.com/geodle-game/ai-agent/main/models/manifest.json">
  <label>Base URL for chunks</label>
  <input id="baseUrl"
    value="https://raw.githubusercontent.com/geodle-game/ai-agent/main/models/">
  <button id="loadBtn">Download & Load Model</button>
  <div id="bar"><div id="fill"></div></div>
  <input id="prompt" placeholder="Say hi in 5 words" value="Say hi in 5 words" disabled>
  <button id="genBtn" disabled>Generate</button>
  <div id="log"></div>

<script type="module">
const $ = id => document.getElementById(id);
const logEl = $('log');
function log(msg, cls='') {
  logEl.innerHTML += `<span class="${cls}">${msg}\n</span>`;
  logEl.scrollTop = logEl.scrollHeight;
  console.log(msg);
}
function setProgress(pct) { $('fill').style.width = pct.toFixed(1) + '%'; }

let wllama = null;

async function fetchManifest(url) {
  log(`Fetching manifest: ${url}`);
  const res = await fetch(url, { cache: 'no-cache' });
  if (!res.ok) throw new Error(`manifest HTTP ${res.status}`);
  const m = await res.json();
  log(`Manifest OK: ${m.num_chunks} chunks, ${(m.total_size_bytes/1048576).toFixed(1)} MB total`, 'ok');
  return m;
}

async function fetchChunk(url, retries = 2) {
  for (let i = 0; i <= retries; i++) {
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const buf = await res.arrayBuffer();
      if (buf.byteLength === 0) throw new Error('empty chunk');
      return buf;
    } catch (e) {
      if (i === retries) throw e;
      log(`  retry ${i+1} for ${url.split('/').pop()}: ${e.message}`, 'warn');
      await new Promise(r => setTimeout(r, 500 * (i + 1)));
    }
  }
}

async function fetchAllChunks(manifest, baseUrl) {
  const parts = new Array(manifest.num_chunks);
  const total = manifest.num_chunks;
  let done = 0, bytes = 0, next = 0;
  const CONCURRENCY = 3;

  async function worker() {
    while (true) {
      const idx = next++;
      if (idx >= total) return;
      const name = manifest.chunks[idx];
      const buf = await fetchChunk(baseUrl + name);
      parts[idx] = buf;
      done++; bytes += buf.byteLength;
      setProgress((bytes / manifest.total_size_bytes) * 100);
      if (done % 5 === 0 || done === total) {
        log(`  ${done}/${total} chunks, ${(bytes/1048576).toFixed(1)} MB`);
      }
    }
  }

  await Promise.all(Array.from({ length: CONCURRENCY }, worker));
  return parts;
}

async function assemble(parts, manifest) {
  log('Assembling Blob…');
  const blob = new Blob(parts, { type: 'application/octet-stream' });
  log(`Assembled size: ${blob.size} bytes (expected ${manifest.total_size_bytes})`);
  if (blob.size !== manifest.total_size_bytes) {
    throw new Error(`size mismatch: got ${blob.size}, expected ${manifest.total_size_bytes}`);
  }

  // Verify GGUF magic number (first 4 bytes)
  const header = new Uint8Array(await blob.slice(0, 4).arrayBuffer());
  const magic = String.fromCharCode(...header);
  const hex = Array.from(header).map(b => b.toString(16).padStart(2, '0')).join(' ');
  log(`Header bytes: "${magic}" (hex: ${hex})`);

  if (magic !== 'GGUF') {
    throw new Error(`Invalid magic number: expected "GGUF", got "${magic}". Chunks are out of order or corrupted.`);
  }

  // Also check GGUF version (bytes 4-7, little-endian uint32)
  const verBuf = new Uint8Array(await blob.slice(4, 8).arrayBuffer());
  const version = new DataView(verBuf.buffer).getUint32(0, true);
  log(`GGUF version: ${version}`);

  log('Size and header verified.', 'ok');
  return blob;
}

async function loadWllama(blob) {
  log('Importing wllama…');
  const { Wllama } = await import('https://cdn.jsdelivr.net/npm/@wllama/wllama@2.3.1/esm/index.js');

  const CONFIG_PATHS = {
    'single-thread/wllama.wasm':
      'https://cdn.jsdelivr.net/npm/@wllama/wllama@2.3.1/src/single-thread/wllama.wasm',
  };

  wllama = new Wllama(CONFIG_PATHS);
  log('wllama instantiated. Loading model from Blob…');

  await wllama.loadModel([blob], {
    n_ctx: 2048,
    n_threads: 1,
    progressCallback: ({ loaded, total }) => {
      const pct = (loaded / total) * 100;
      if (Math.round(pct) % 10 === 0) log(`  model load: ${pct.toFixed(0)}%`);
    },
  });

  log('MODEL LOADED', 'ok');
}

async function generate() {
  const prompt = $('prompt').value;
  log(`Prompt: "${prompt}"`);
  try {
    const t0 = performance.now();
    let n = 0;
    const out = await wllama.createCompletion(prompt, {
      nPredict: 64,
      sampling: { temp: 0.7 },
      onNewToken: () => { n++; },
    });
    const dt = ((performance.now() - t0) / 1000).toFixed(1);
    log(`OUTPUT: ${out}`, 'ok');
    log(`Done: ${n} tokens in ${dt}s = ${(n/dt).toFixed(1)} tok/s`, 'ok');
  } catch (e) {
    log(`GENERATION FAILED: ${e.message}`, 'err');
  }
}

$('loadBtn').onclick = async () => {
  $('loadBtn').disabled = true;
  try {
    const manifest = await fetchManifest($('manifestUrl').value.trim());
    const parts = await fetchAllChunks(manifest, $('baseUrl').value.trim());
    const blob = await assemble(parts, manifest);
    await loadWllama(blob);
    $('prompt').disabled = false;
    $('genBtn').disabled = false;
    $('genBtn').onclick = generate;
    log('Ready. Tap Generate.', 'ok');
  } catch (e) {
    log(`LOAD FAILED: ${e.message}`, 'err');
    console.error(e);
    $('loadBtn').disabled = false;
  }
};

log('Page ready. Tap "Download & Load Model".');
</script>
</body>
</html>
