<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nanbeige ONNX — Transformers.js</title>
  <style>
    body { font-family: -apple-system, sans-serif; padding: 16px; max-width: 720px; margin: 0 auto; }
    button, input { font-size: 16px; padding: 10px; margin: 6px 0; width: 100%; box-sizing: border-box; }
    #log { background:#111; color:#0f0; font-family:monospace; font-size:12px; padding:12px;
           height:320px; overflow-y:auto; white-space:pre-wrap; border-radius:8px; }
    .ok{color:#0f0} .err{color:#f55} .warn{color:#ff0}
    #status { padding: 10px; background: #222; color: #fff; border-radius: 8px; margin: 8px 0; }
  </style>
</head>
<body>
  <h2>Nanbeige ONNX Loader</h2>
  <p>Loads via Transformers.js + ONNX Runtime Web. No wllama, no chunking.</p>
  <button id="loadBtn">Load Model</button>
  <div id="status">Idle</div>
  <input id="prompt" placeholder="Say hi in 5 words" value="Say hi in 5 words" disabled>
  <button id="genBtn" disabled>Generate</button>
  <div id="log"></div>

<script type="module">
const $ = id => document.getElementById(id);
const logEl = $('log');
function log(msg, cls='') {
  logEl.innerHTML += `<span class="${cls}">${msg}\n</span>`;
  logEl.scrollTop = logEl.scrollHeight;
  console.log(msg);
}
function setStatus(msg, cls='') {
  $('status').textContent = msg;
  $('status').className = cls;
}

let pipe = null;

// ------------------------------------------------------------
// Load via Transformers.js
// ------------------------------------------------------------
$('loadBtn').onclick = async () => {
  $('loadBtn').disabled = true;
  setStatus('Loading Transformers.js…', 'warn');

  try {
    // Import Transformers.js from CDN (no build step)
    const { pipeline, env } = await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.0');

    // Optional: use WebGPU if available for speed
    // Safari iOS WebGPU support is limited, so we default to WASM.
    const hasWebGPU = !!navigator.gpu;
    log(`WebGPU available: ${hasWebGPU}`);

    setStatus('Loading Nanbeige ONNX model… (this may take several minutes)');
    log('Loading model from Hugging Face: nicolasembleton/Nanbeige4.2-3B-ONNX');

    // This triggers the download of the ONNX graph + external data shards.
    // Transformers.js handles caching via the browser Cache API.
    pipe = await pipeline(
      'text-generation',
      'nicolasembleton/Nanbeige4.2-3B-ONNX',
      {
        dtype: 'q4',          // use quantized weights if available; fallback to fp16
        device: hasWebGPU ? 'webgpu' : 'wasm',
        progress_callback: (p) => {
          if (p.status === 'progress') {
            const pct = p.progress ? p.progress.toFixed(1) : '?';
            log(`  ${p.file}: ${pct}%`);
          } else if (p.status === 'done') {
            log(`  done: ${p.file}`, 'ok');
          }
        },
      }
    );

    log('MODEL LOADED', 'ok');
    setStatus('Model loaded. Ready to generate.', 'ok');
    $('prompt').disabled = false;
    $('genBtn').disabled = false;
    $('genBtn').onclick = generate;

  } catch (e) {
    log(`LOAD FAILED: ${e.message}`, 'err');
    console.error(e);
    setStatus('Load failed: ' + e.message, 'err');
    $('loadBtn').disabled = false;
  }
};

// ------------------------------------------------------------
// Generate
// ------------------------------------------------------------
async function generate() {
  const prompt = $('prompt').value;
  log(`Prompt: "${prompt}"`);
  setStatus('Generating…', 'warn');

  try {
    const t0 = performance.now();
    const output = await pipe(prompt, {
      max_new_tokens: 64,
      temperature: 0.7,
      do_sample: true,
    });
    const dt = ((performance.now() - t0) / 1000).toFixed(1);

    const text = output[0].generated_text;
    log(`OUTPUT: ${text}`, 'ok');
    setStatus(`Generated in ${dt}s`, 'ok');

  } catch (e) {
    log(`GENERATION FAILED: ${e.message}`, 'err');
    setStatus('Generation failed', 'err');
  }
}

log('Page ready. Tap "Load Model".');
</script>
</body>
</html>
